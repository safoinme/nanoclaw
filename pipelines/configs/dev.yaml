# Development configuration for NanoClaw pipelines
# Usage: python run.py --pipeline knowledge_ingest --config configs/dev.yaml

enable_cache: false

settings:
  docker:
    requirements:
      - pydantic-ai[anthropic]
      - python-frontmatter
      - e2b-code-interpreter
      - httpx
      - readability-lxml
      - python-slugify
      - s3fs>2022.3.0,!=2025.3.1
      - requests>=2.32.0
      - urllib3>=2.0,<3.0
      - chardet<6.0.0
    python_package_installer: uv
    apt_packages:
      - libxml2-dev
      - libxslt1-dev
